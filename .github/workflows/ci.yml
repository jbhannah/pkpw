on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --verbose
  test-wasm:
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v5
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack test --node
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    needs: clippy
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --verbose --release
      - run: cargo test --verbose --release
      - uses: actions/upload-artifact@v6
        with:
          name: pkpw-${{ (github.ref_type == 'tag' && github.ref_name) || github.sha }}-${{ runner.os }}-${{ runner.arch }}
          path: target/release/pkpw${{ (runner.os == 'Windows' && '.exe') || '' }}
